<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%" role="img" aria-label="Pixel Island Banner">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="55%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <radialGradient id="glowBlue" cx="78%" cy="48%" r="42%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.18" />
      <stop offset="55%" stop-color="#6366F1" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#090D16" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="50%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="bezelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="albumGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <clipPath id="cardClip">
      <rect x="0" y="0" width="1200" height="340" rx="24" />
    </clipPath>
  </defs>

  <g clip-path="url(#cardClip)">
    <rect x="0" y="0" width="1200" height="340" fill="url(#bgGrad)" />
    <rect x="0" y="0" width="1200" height="340" fill="url(#glowBlue)" />

    <!-- Subtle grid accent -->
    <g stroke="#1E293B" stroke-width="1" opacity="0.35">
      <line x1="680" y1="0" x2="680" y2="340" />
      <line x1="800" y1="0" x2="800" y2="340" />
      <line x1="920" y1="0" x2="920" y2="340" />
      <line x1="1040" y1="0" x2="1040" y2="340" />
      <line x1="660" y1="90" x2="1200" y2="90" />
      <line x1="660" y1="190" x2="1200" y2="190" />
      <line x1="660" y1="290" x2="1200" y2="290" />
    </g>

    <!-- Left Typography -->
    <rect x="68" y="62" width="256" height="28" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <circle cx="84" cy="76" r="4" fill="#34D399" />
    <text x="97" y="80" fill="#CBD5E1" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" letter-spacing="0.8">PIXEL 8 PRO  •  ANDROID 14+</text>

    <text x="68" y="148" fill="#F8FAFC" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="56" font-weight="800" letter-spacing="-1.2">Pixel Island</text>

    <text x="68" y="190" fill="#94A3B8" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18.5" font-weight="400">Îlot dynamique natif à 120 Hz, fusionné au poinçon OLED</text>
    <text x="68" y="217" fill="#94A3B8" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18.5" font-weight="400">pour le contrôle multimédia et la biométrie Face ID 3D.</text>

    <!-- Feature Chips -->
    <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#E2E8F0">
      <rect x="68" y="252" width="84" height="30" rx="8" fill="#1E293B" stroke="#334155" />
      <text x="110" y="271" text-anchor="middle">Kotlin</text>

      <rect x="162" y="252" width="144" height="30" rx="8" fill="#1E293B" stroke="#334155" />
      <text x="234" y="271" text-anchor="middle">Jetpack Compose</text>

      <rect x="316" y="252" width="152" height="30" rx="8" fill="#1E293B" stroke="#334155" />
      <text x="392" y="271" text-anchor="middle">Clean Architecture</text>

      <rect x="478" y="252" width="128" height="30" rx="8" fill="#064E3B" fill-opacity="0.55" stroke="#059669" />
      <text x="542" y="271" text-anchor="middle" fill="#6EE7B7">100% Hors Ligne</text>
    </g>

    <!-- Stylized Pixel 8 Pro Top Chassis -->
    <rect x="736" y="54" width="388" height="360" rx="48" fill="url(#bezelGrad)" stroke="#64748B" stroke-width="1.5" />
    <rect x="746" y="64" width="368" height="350" rx="40" fill="#05070B" />
    <rect x="754" y="72" width="352" height="342" rx="34" fill="url(#screenGrad)" />

    <!-- Status Bar Elements -->
    <text x="782" y="108" fill="#E2E8F0" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">16:40</text>
    <!-- Signal & Battery icons -->
    <rect x="1056" y="98" width="22" height="11" rx="3" fill="none" stroke="#E2E8F0" stroke-width="1.4" />
    <rect x="1058.5" y="100.5" width="15" height="6" rx="1.5" fill="#34D399" />
    <rect x="1079" y="101" width="2" height="5" rx="1" fill="#E2E8F0" />

    <!-- Dynamic Island Active Pill (#000000 pure OLED) -->
    <rect x="822" y="82" width="216" height="42" rx="21" fill="#000000" stroke="#1E293B" stroke-width="0.8" />

    <!-- Album Art inside Pill (Left) -->
    <rect x="831" y="89" width="28" height="28" rx="9" fill="url(#albumGrad)" />
    <circle cx="845" cy="103" r="5" fill="#FFFFFF" fill-opacity="0.85" />
    <circle cx="845" cy="103" r="1.8" fill="#1E1B4B" />

    <!-- Physical Camera Punch-Hole Lens (Center X = 930) -->
    <circle cx="930" cy="103" r="11" fill="#070B12" stroke="#111827" stroke-width="1.2" />
    <circle cx="930" cy="103" r="5.5" fill="#0F172A" />
    <circle cx="928" cy="101" r="2" fill="#38BDF8" fill-opacity="0.55" />

    <!-- Equalizer Bars inside Pill (Right) -->
    <g fill="#A855F7">
      <rect x="996" y="99" width="3.5" height="8" rx="1.75" fill="#C084FC" />
      <rect x="1003" y="93" width="3.5" height="20" rx="1.75" fill="#E879F9" />
      <rect x="1010" y="96" width="3.5" height="14" rx="1.75" fill="#818CF8" />
      <rect x="1017" y="100" width="3.5" height="6" rx="1.75" fill="#34D399" />
    </g>

    <!-- Subtle Floating Face ID Card Preview below inside phone screen -->
    <rect x="782" y="152" width="296" height="146" rx="28" fill="#000000" fill-opacity="0.82" stroke="#334155" stroke-width="1" />
    <rect x="802" y="172" width="56" height="56" rx="14" fill="url(#albumGrad)" />
    <text x="874" y="194" fill="#F8FAFC" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">Midnight City</text>
    <text x="874" y="214" fill="#94A3B8" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5">M83  •  Hurry Up, We're Dreaming</text>

    <!-- Scrubber preview -->
    <rect x="802" y="246" width="256" height="5" rx="2.5" fill="#334155" />
    <rect x="802" y="246" width="148" height="5" rx="2.5" fill="#F8FAFC" />

    <!-- Playback icons preview -->
    <polygon points="926,267 926,283 940,275" fill="#F8FAFC" />
    <polygon points="888,275 898,268 898,282" fill="#CBD5E1" />
    <polygon points="972,275 962,268 962,282" fill="#CBD5E1" />
  </g>

  <rect x="0.75" y="0.75" width="1198.5" height="338.5" rx="23.25" fill="none" stroke="#1E293B" stroke-width="1.5" />
</svg>
