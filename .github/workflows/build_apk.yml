name: Build Android APK

on:
  push:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
          cache-disabled: true

      - name: Run Unit Tests
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest --stacktrace 2>&1 | tee test_log.txt

      - name: Build Debug APK
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace 2>&1 | tee build_log.txt

      - name: Surface Build Error
        if: failure()
        run: |
          ERR=$(grep -E "(e: |error:|FAILED|Exception)" build_log.txt | tail -n 10 | tr '\r\n' '  ')
          if [ -z "$ERR" ]; then
            ERR=$(tail -n 20 build_log.txt | tr '\r\n' '  ')
          fi
          echo "::error title=Gradle Error::$ERR"

      - name: Prepare APK filename
        run: |
          find app/build -name "*.apk"
          APK_PATH=$(find app/build -name "*.apk" | head -n 1)
          if [ -n "$APK_PATH" ]; then
            mkdir -p app/build/outputs/apk/debug
            cp "$APK_PATH" app/build/outputs/apk/debug/pixel_island.apk
          else
            echo "::error::No APK found in app/build"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pixel_island_debug_apk
          path: app/build/outputs/apk/debug/pixel_island.apk

      - name: Extract Version
        id: get_version
        run: |
          VERSION=$(grep 'versionName =' app/build.gradle.kts | head -n 1 | cut -d '"' -f 2)
          echo "version=v$VERSION" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          name: Pixel Island ${{ steps.get_version.outputs.version }} APK
          body: Pixel Island release ${{ steps.get_version.outputs.version }} avec securisation des commandes, interpolation de la progression et compatibilite Android 14
          files: app/build/outputs/apk/debug/pixel_island.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
