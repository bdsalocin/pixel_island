name: Build Android APK

on:
  push:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare APK filename
        run: cp app/build/outputs/apk/debug/*.apk app/build/outputs/apk/debug/pixel_island.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pixel_island_debug_apk
          path: app/build/outputs/apk/debug/pixel_island.apk

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          name: Pixel Island v1.1.0 APK
          body: Mise a jour avec centrage exact Pixel 8 Pro, ecoute audio multi-lecteurs et deverrouillage facial
          files: app/build/outputs/apk/debug/pixel_island.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
