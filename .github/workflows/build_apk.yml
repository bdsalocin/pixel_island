name: Build Android APK

on:
  push:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
          cache-disabled: true

      - name: Build Debug APK
        run: |
          gradle :app:assembleDebug --stacktrace 2>&1 | tee build_log.txt || {
            ERR=$(tail -n 30 build_log.txt | tr '\r\n' '  ')
            echo "::error title=Gradle Build Failure::$ERR"
            exit 1
          }

      - name: Prepare APK filename
        run: |
          find app/build -name "*.apk"
          APK_PATH=$(find app/build -name "*.apk" | head -n 1)
          if [ -n "$APK_PATH" ]; then
            mkdir -p app/build/outputs/apk/debug
            cp "$APK_PATH" app/build/outputs/apk/debug/pixel_island.apk
          else
            echo "::error::No APK found in app/build"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pixel_island_debug_apk
          path: app/build/outputs/apk/debug/pixel_island.apk

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.4.1
          name: Pixel Island v1.4.1 APK
          body: Dynamic Island carte media interactive au clic, detection robuste audio video et fermeture rapide Pixel Face
          files: app/build/outputs/apk/debug/pixel_island.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
